<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyLifeNWK</title>
<meta name="description" content="MyLifeNWK: aplicativos para o seu dia a dia. Escolha um e baixe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #25272b;
    --surface: #2f3237;
    --line: #44474d;
    --text: #ece8e2;
    --muted: #b3afa8;
    --orange: #d2692b;
    --orange-hover: #e07a3c;
    --orange-text: #e58a50;
    --on-orange: #1b1c1f;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    line-height: 1.6;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--orange-text); outline-offset: 3px; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }

  /* Cabeçalho */
  header { border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; justify-content: space-between; align-items: center; padding-top: 18px; padding-bottom: 18px; }
  .logo { font-family: var(--display); font-weight: 800; font-size: 1.35rem; text-decoration: none; letter-spacing: -0.01em; }
  .logo span { color: var(--orange-text); }
  nav { display: flex; gap: 22px; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a:hover { color: var(--text); }

  /* Destaque */
  .hero { padding: 88px 0 72px; }
  .hero .wrap { border-left: 10px solid var(--orange); padding-left: 28px; margin-left: max(24px, calc((100vw - 960px) / 2)); max-width: 760px; }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 7vw, 4.4rem); line-height: 1.04; letter-spacing: -0.02em; }
  .hero p { margin-top: 20px; max-width: 46ch; color: var(--muted); font-size: 1.1rem; }

  .btn {
    display: inline-block; padding: 13px 26px; border-radius: 8px;
    background: var(--orange); color: var(--on-orange);
    font-weight: 700; text-decoration: none; border: 0; cursor: pointer;
  }
  .btn:hover { background: var(--orange-hover); }
  .hero .btn { margin-top: 30px; }

  /* Aplicativos */
  section { padding: 56px 0; }
  h2 { font-family: var(--display); font-size: 1.9rem; font-weight: 700; letter-spacing: -0.01em; }
  .lead { color: var(--muted); margin-top: 6px; }
  .apps { display: grid; gap: 24px; margin-top: 32px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }

  .app {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 16px;
  }
  .app-icon {
    width: 72px; height: 72px; border-radius: 18px;
    background: var(--orange); color: var(--on-orange);
    display: grid; place-items: center;
    font-family: var(--display); font-weight: 800; font-size: 2rem;
    overflow: hidden;
  }
  .app-icon img { width: 100%; height: 100%; object-fit: cover; }
  .app h3 { font-family: var(--display); font-size: 1.4rem; }
  .app p { color: var(--muted); }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 0.95rem; border-top: 1px solid var(--line); padding-top: 14px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; }
  .app .btn { text-align: center; margin-top: auto; }

  .app.soon { border-style: dashed; background: transparent; justify-content: center; text-align: center; min-height: 280px; }
  .app.soon p { max-width: 28ch; margin: 0 auto; }

  /* Sobre */
  .about { border-top: 1px solid var(--line); }
  .about p { margin-top: 12px; max-width: 60ch; color: var(--muted); }

  footer { border-top: 1px solid var(--line); padding: 28px 0; color: var(--muted); font-size: 0.95rem; }

  @media (max-width: 560px) {
    .hero { padding: 56px 0 48px; }
    .hero .wrap { border-left-width: 8px; padding-left: 18px; margin-left: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="#">MyLife<span>NWK</span></a>
    <nav aria-label="Principal">
      <a href="#aplicativos">Aplicativos</a>
          </dl>

          <!-- ARQUIVO DE DOWNLOAD: troque "arquivos/meu-app.apk" pelo caminho
               ou link do seu arquivo (ex.: arquivos/meu-app.apk ou um link do Drive) -->
          <a class="btn" href="arquivos/meu-app.apk" download>Baixar aplicativo</a>
        </article>

        <!-- ============================================================
             PARA ADICIONAR OUTRO APLICATIVO NO FUTURO:
             copie o bloco <article class="app"> ... </article> acima,
             cole logo abaixo e troque nome, descrição e link.
             ============================================================ -->

        <article class="app soon">
          <h3>Novos aplicativos em breve</h3>
          <p>Outros apps da MyLifeNWK vão aparecer aqui.</p>
        </article>

      </div>
    </div>
  </section>

  <section id="sobre" class="about">
    <div class="wrap">
      <h2>Sobre a MyLifeNWK</h2>
      <!-- TEXTO SOBRE VOCÊ OU A MARCA (EDITE AQUI) -->
      <p>Escreva aqui uma breve apresentação: quem faz os aplicativos e qual é a ideia por trás deles.</p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <!-- CONTATO (EDITE AQUI): troque pelo seu e-mail -->
    © 2026 MyLifeNWK. Contato: <a href="mailto:seuemail@exemplo.com">seuemail@exemplo.com</a>
  </div>
</footer>

</body>
</html>
